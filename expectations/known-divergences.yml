# Divergences between Chromium and Dommy that are NOT findings.
#
# A browser is an oracle, not the specification. Two things land here:
#
#   * Chromium departs from the spec text and Dommy follows it.
#   * The difference is a deliberate, documented limit of Dommy (it has no
#     layout, so anything geometric cannot agree).
#
# A third kind is recorded with `dommy_bug:` instead of `reason:` — a real Dommy
# bug that has been identified but not yet fixed. It does not fail the run (so a
# known debt does not mask new findings) but it is reported separately from the
# spec-over-Chromium ones, because "the browser is wrong" and "we are wrong" must
# never read the same.
#
# Anything else is a finding and should be fixed rather than recorded. Each
# entry pins the two values it was recorded against, so a divergence that
# quietly changes shape is flagged instead of silently staying green.
#
#   - case:      the case id, e.g. "cssom/set-property-priority.js"
#     key:       the key in that case's returned observation
#     reason:    why this is not a bug, with the spec reference
#     chromium:  the value recorded for Chromium (optional but recommended)
#     dommy:     the value recorded for Dommy (optional but recommended)

- case: cssom/set-property-priority.js
  key: emptyValueWithInvalidPriority
  reason: |
    CSSOM setProperty step 3 ("if value is the empty string, invoke
    removeProperty and return") precedes step 4 (the priority check), so an
    empty value removes the declaration whatever the priority says. Chromium
    validates the priority first and keeps the declaration. No WPT covers the
    ordering; Dommy follows the spec text.
    https://drafts.csswg.org/cssom/#dom-cssstyledeclaration-setproperty
  chromium: "color: red !important"
  dommy: ""

- case: fuzz/tree-mutations.js
  key: "*"
  step_divergence:
    op: setTextContent
    keys: [iterators]
  reason: |
    Where a NodeIterator's reference lands when "replace all" removes several
    children at once. The pre-removing steps set the reference to the removed
    node's parent when its previous sibling is null, and otherwise to the last
    inclusive descendant of that previous sibling — read off the LIVE tree, and
    "replace all" removes children one at a time in tree order. So by the time
    the reference's own ancestor is removed, its earlier siblings are already
    gone, its previous sibling is null, and the reference becomes the parent.
    That is what Dommy does.

    Chromium resolves the previous sibling against the pre-removal child list
    and leaves the reference on a node detached by the same operation — which
    also defeats the purpose of the steps, since the reference ends up outside
    the iterator's collection entirely.
    https://dom.spec.whatwg.org/#nodeiterator-pre-removing-steps

- case: fuzz/tree-mutations.js
  key: "*"
  step_divergence:
    op: replaceChildren
    keys: [iterators]
  reason: |
    The same divergence as the setTextContent entry above, reached through
    replaceChildren instead: both are "replace all" internally, and both remove
    the children one at a time in tree order. The op is pinned so an iterators
    divergence at some OTHER operation is still a finding.
    https://dom.spec.whatwg.org/#nodeiterator-pre-removing-steps

- case: fuzz/tree-mutations.js
  key: "*"
  step_divergence:
    op: insertBefore
    keys: [ranges]
  reason: |
    Live-range offset shift when a node is MOVED WITHIN ITS OWN PARENT with a
    non-null reference child, and a boundary sits on that parent. insert step 5
    (shift the boundaries past `child`'s index) runs BEFORE step 7.1's adopt,
    which is what removes the node — so the two adjustments compose as
    shift-then-remove, and a boundary at the child's old index nets out to the
    value step 5 gives. Dommy runs the steps where the spec puts them and gets
    that value.

    Chromium (and Firefox and WebKit) instead behave as if the removal ran
    first: the boundary moves to the old index and is then shifted, one more
    than the spec text. With `p` holding [A, B, comment, C] and a boundary at
    (p, 3), `p.insertBefore(C, comment)` moves it to 4 in Chromium and 3 in
    Dommy.

    The divergence is the exact inverse of the one lean4-dom records as
    `range-adjust-order-on-move` / `-on-before` / `range-order-broken-by-insert`
    (lean4-dom `test/known-divergences.yml`). The spec text and the DOM
    Standard's editor's own jsdom (`94301581 Align node insertion with the DOM
    Standard`, 2026-08-01) both answer the spec-text value; the npm jsdom
    releases and every shipping engine answer Chromium's.

    WPT does not settle it: `dom/ranges/Range-mutations.js` computes its
    expectation as modifyForRemove-then-modifyForInsert (the Chromium order),
    but none of its insertBeforeTests changes the moved node's index within its
    own parent — the same-parent cases all move a node back to where it already
    was, where neither order shifts anything — so the file never exercises the
    spot where the two orders differ. The diverging spot is only reachable when
    the same-parent move actually changes the node's index.
    https://dom.spec.whatwg.org/#concept-node-insert

- case: url/location-and-base.js
  key: formAction
  dommy_bug: |
    `form.action` is a URL-reflecting IDL attribute: its getter parses the
    content attribute against the element's node document's base URL and returns
    the serialized result (and returns the document's URL when the attribute is
    absent). Dommy returns the content attribute verbatim, so `action="post"`
    under `<base href="/base/sub/">` reads as "post" rather than
    "http://oracle.test/base/sub/post".

    The same getter shape applies to every URL-reflecting attribute, so the fix
    belongs with the reflection helper rather than with `form`.
    https://html.spec.whatwg.org/multipage/common-dom-interfaces.html#reflecting-content-attributes-in-idl-attributes
  chromium: "http://oracle.test/base/sub/post"
  dommy: "post"
